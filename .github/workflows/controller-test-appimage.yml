name: Controller fix AppImage

on:
  push:
    branches: [fix/controller-input-state]
    paths: [.github/workflows/controller-test-appimage.yml, src/**, electron/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build renderer and Electron
        run: pnpm build
      - name: Package Linux x86_64 AppImage
        run: pnpm exec electron-builder --linux AppImage --x64 --publish never
      - name: Checksum
        working-directory: release
        run: sha256sum crunchy-deck.AppImage > SHA256SUMS
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: crunchy-deck-controller-fix-linux-x64
          path: |
            release/crunchy-deck.AppImage
            release/SHA256SUMS
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          Steam Deck / Linux x86_64 test build with the controller input fix.

          Includes the multiple-controller fix plus input suspension while the app is unfocused, hidden, or a Steam chord is active. Controllers must return to neutral before app input resumes, preventing overlay dismissal presses from leaking into the app.

          Download crunchy-deck.AppImage below, make it executable, and launch with --no-sandbox (also use this argument when adding it to Steam).

          Regression coverage includes search text insertion while controller input is suspended, Steam chord handling, and neutral-before-resume behavior with both controller slots. Physical Steam overlay behavior and signed-in playback need testing on your Deck.

          This test build retains version 0.2.1 and the upstream updater. Avoid installing upstream updates while testing this fix.
          NOTES
          gh release create "controller-test-${BUILD_COMMIT:0:7}" \
            release/crunchy-deck.AppImage release/SHA256SUMS \
            --target "$BUILD_COMMIT" --prerelease --latest=false \
            --title "Steam overlay input fix — Steam Deck test AppImage" \
            --notes-file /tmp/release-notes.md
